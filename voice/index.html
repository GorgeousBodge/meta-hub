<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>Voice Check</title>
  <link rel="icon" href="/icon-96.png" sizes="96x96" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/deck/style.css">
  <style>
    #page { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }
    .vc-info { padding: 10px var(--pad) 0; font-size: 15px; line-height: 1.35; color: var(--dim); }
    .vc-info b { color: var(--accent); font-weight: 600; }
    .vc-list { padding-top: 10px; gap: 8px; }
    .vc-list .card { min-height: 64px; padding: 10px 14px; gap: 4px; justify-content: center; }
    .vc-list .card-title { font-size: 19px; -webkit-line-clamp: 1; }
    .vc-list .card-meta { font-size: 13px; }
    .vc-list .ok { color: var(--ok); }
    .vc-list .bad { color: var(--warn); }
    .vc-list .wait { color: var(--amber); }
    .vc-sec { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); padding: 6px 2px 0; }
    .vc-keys { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px var(--pad) 10px; }
    .vc-keys .key { height: 58px; }
    .vc-keys .key .ico { font-size: 22px; }
  </style>
</head>
<body>
  <div class="frame">
    <header class="hud">
      <button class="hud-back focusable" id="hudBack" type="button" aria-label="Back" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="hud-heading">
        <h1 class="hud-title" id="hudTitle">Voice</h1>
        <span class="hud-sub" id="hudSub">Check</span>
      </div>
      <div class="hud-status">
        <span class="status-dot" id="hudDot" aria-hidden="true"></span>
        <span id="hudStatus"></span>
        <time class="hud-clock" id="hudClock">--:--</time>
      </div>
    </header>

    <main class="stage">
      <div id="page">
        <p class="vc-info" id="info"></p>
        <div class="list vc-list" id="list"></div>
        <div class="vc-keys">
          <button type="button" class="key key-speak focusable" id="useBtn">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span class="key-label">Use last test</span>
          </button>
          <button type="button" class="key focusable" id="resetBtn">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5V9h-4.5"/></svg><span class="key-label">Reset</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="hints" id="hints" aria-hidden="true"></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="/deck/deck.js"></script>
  <script src="/voice/app.js"></script>
</body>
</html>
