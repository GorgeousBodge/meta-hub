<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="description" content="Bamberland: a small turn-based adventure for the glasses.">
  <title>Bamberland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/deck/style.css">
  <link rel="stylesheet" href="/bamberland/bamberland.css">
</head>
<body>
  <div class="frame">
    <!-- HUD: same ids as every Deck app. In play, hearts / keys / coins / item replace the title. -->
    <header class="hud">
      <button class="hud-back focusable" id="hudBack" type="button" aria-label="Back" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="hud-heading">
        <h1 class="hud-title" id="hudTitle">Bamberland</h1>
        <span class="hud-sub" id="hudSub"></span>
        <div class="bl-stats" id="stats" hidden>
          <span class="bl-hearts" id="hearts" aria-label="Hearts"></span>
          <span class="bl-keys" id="keys" aria-label="Small keys"></span>
          <span class="bl-bigkey" id="bigkey" aria-label="Big key"></span>
          <span class="bl-coins" id="coins" aria-label="Money"></span>
        </div>
      </div>
      <div class="bl-equip" id="equip" hidden aria-label="Equipped"></div>
      <div class="hud-status">
        <span class="status-dot" id="hudDot" aria-hidden="true"></span>
        <span id="hudStatus"></span>
        <time class="hud-clock" id="hudClock">--:--</time>
      </div>
    </header>

    <main class="stage">
      <!-- Title screen -->
      <section class="view bl-title" id="titleView">
        <canvas class="bl-title-art" id="titleArt" width="200" height="150" aria-hidden="true"></canvas>
        <p class="bl-lore" id="titleLore"></p>
        <div class="bl-menu">
          <button type="button" class="key key-speak focusable" id="btnContinue">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 19.5 12 7 19.5Z"/></svg>
            <span class="key-label">Continue</span>
          </button>
          <button type="button" class="key focusable" id="btnPlay">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>
            <span class="key-label">Save slots</span>
          </button>
          <button type="button" class="key focusable bl-toggle" id="btnMusic">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
            <span class="key-label">Music: Off</span>
          </button>
          <button type="button" class="key focusable bl-toggle" id="btnSound">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h4l5-4v13l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6"/></svg>
            <span class="key-label">Sound: Off</span>
          </button>
        </div>
      </section>

      <!-- Save slots -->
      <section class="view bl-slots" id="slotsView" hidden>
        <button type="button" class="key focusable bl-slot" id="slot1" data-slot="1"><span class="bl-slot-title"></span><span class="bl-slot-detail"></span></button>
        <button type="button" class="key focusable bl-slot" id="slot2" data-slot="2"><span class="bl-slot-title"></span><span class="bl-slot-detail"></span></button>
        <button type="button" class="key focusable bl-slot" id="slot3" data-slot="3"><span class="bl-slot-title"></span><span class="bl-slot-detail"></span></button>
        <button type="button" class="key focusable bl-erase" id="btnErase"><span class="key-label">Erase a slot</span></button>
        <p class="bl-note" id="slotsNote"></p>
      </section>

      <!-- Naming, before a new game -->
      <section class="view bl-naming" id="nameView" hidden>
        <p class="bl-note">Pinch a name to change it. Leave them as they are, or make it yours.</p>
        <div class="bl-name-grid" id="nameGrid"></div>
        <button type="button" class="key key-speak focusable bl-begin" id="btnBegin">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 19.5 12 7 19.5Z"/></svg>
          <span class="key-label">Begin</span>
        </button>
        <div class="bl-name-edit" id="nameEdit" hidden>
          <label class="bl-name-for" id="nameEditFor" for="nameInput"></label>
          <label class="field-wrap bl-name-field">
            <input class="field bl-name-input" id="nameInput" type="text" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false">
          </label>
          <p class="bl-note">Write, say or type the new name, then Back when you're done. Empty the box to keep the original name.</p>
        </div>
      </section>

      <!-- The game board: 600×504, a 15×12 grid of 40 px tiles -->
      <canvas class="bl-board" id="board" width="600" height="504" hidden aria-label="Game board"></canvas>

      <!-- Dialogue box, with room for a portrait -->
      <div class="bl-dialog" id="dialog" hidden role="dialog" aria-live="polite">
        <canvas class="bl-face" id="dialogFace" width="96" height="96" hidden aria-hidden="true"></canvas>
        <div class="bl-dialog-who" id="dialogWho"></div>
        <p class="bl-dialog-text" id="dialogText"></p>
        <div class="bl-dialog-more" id="dialogMore">Pinch ▸</div>
      </div>

      <!-- Out cold / the end -->
      <div class="bl-overlay" id="overlay" hidden>
        <div class="state">
          <div class="state-title" id="overTitle"></div>
          <div class="state-msg" id="overText"></div>
          <div class="bl-dialog-more">Pinch to continue</div>
        </div>
      </div>
    </main>

    <footer class="hints" id="hints" aria-hidden="true"></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="/deck/deck.js"></script>
  <!-- content: edit these freely -->
  <script src="/bamberland/data/lore.js"></script>
  <script src="/bamberland/data/art.js"></script>
  <script src="/bamberland/data/music.js"></script>
  <script src="/bamberland/data/cutscenes.js"></script>
  <script src="/bamberland/world/regions.js"></script>
  <script src="/bamberland/world/wood.js"></script>
  <script src="/bamberland/world/oak.js"></script>
  <script src="/bamberland/world/mill.js"></script>
  <!-- the engine -->
  <script src="/bamberland/engine/core.js"></script>
  <script src="/bamberland/engine/foes.js"></script>
  <script src="/bamberland/engine/town.js"></script>
  <!-- the screens -->
  <script src="/bamberland/ui/pixel.js"></script>
  <script src="/bamberland/ui/render.js"></script>
  <script src="/bamberland/ui/audio.js"></script>
  <script src="/bamberland/ui/cutscene.js"></script>
  <script src="/bamberland/ui/screens.js"></script>
</body>
</html>
