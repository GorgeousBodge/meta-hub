<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="description" content="Bamberland look test: the natural pixel palette on the glasses.">
  <title>Bamberland look test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/deck/style.css">
  <link rel="stylesheet" href="/bamberland/bamberland.css">
  <link rel="stylesheet" href="/bamberland/looktest/looktest.css">
</head>
<body>
  <div class="frame">
    <header class="hud">
      <button class="hud-back focusable" id="hudBack" type="button" aria-label="Back" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="hud-heading">
        <h1 class="hud-title" id="hudTitle">Look test</h1>
        <span class="hud-sub" id="hudSub"></span>
      </div>
      <div class="hud-status">
        <span class="status-dot" id="hudDot" aria-hidden="true"></span>
        <span id="hudStatus"></span>
        <time class="hud-clock" id="hudClock">--:--</time>
      </div>
    </header>

    <main class="stage">
      <!-- Menu -->
      <section class="view lt-menu" id="menuView">
        <p class="lt-intro">Try each one on the glasses. Pinch inside a screen to switch between versions.</p>
        <div class="lt-grid">
          <button type="button" class="key focusable" data-go="wood"><span class="key-label">Queen's Wood</span></button>
          <button type="button" class="key focusable" data-go="village"><span class="key-label">Bamber village</span></button>
          <button type="button" class="key focusable" data-go="bodge"><span class="key-label">Bodge</span></button>
          <button type="button" class="key focusable" data-go="lauri"><span class="key-label">Lauri</span></button>
          <button type="button" class="key focusable" data-go="cut"><span class="key-label">Cut scene</span></button>
          <button type="button" class="key focusable" data-go="music" id="btnMusic">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
            <span class="key-label">Music: Off</span>
          </button>
        </div>
      </section>

      <!-- Every test screen draws here: 600×504, a 15×12 grid of 40 px tiles -->
      <canvas class="bl-board" id="board" width="600" height="504" hidden aria-label="Look test"></canvas>

      <!-- Dialogue, with room for a portrait -->
      <div class="bl-dialog" id="dialog" hidden role="dialog" aria-live="polite">
        <canvas class="lt-face" id="dialogFace" width="96" height="96" hidden aria-hidden="true"></canvas>
        <div class="bl-dialog-who" id="dialogWho"></div>
        <p class="bl-dialog-text" id="dialogText"></p>
        <div class="bl-dialog-more" id="dialogMore">Pinch ▸</div>
      </div>
    </main>

    <footer class="hints" id="hints" aria-hidden="true"></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="/deck/deck.js"></script>
  <script src="/bamberland/looktest/art.js"></script>
  <script src="/bamberland/looktest/looktest.js"></script>
</body>
</html>
