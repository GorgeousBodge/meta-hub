<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
  <meta name="description" content="Home Assistant controls and Samsung TV remote for Meta Ray-Ban Display">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>Home Deck</title>
  <!-- Glasses icon comes from home/.well-known/meta-wearables-manifest.json; this is the browser tab icon -->
  <link rel="icon" href="/home/icon-96.png" sizes="96x96" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/deck/style.css">
  <link rel="stylesheet" href="/home/home.css">
</head>
<body>
  <!-- Icon sprite: referenced with <use href="#i-name"> -->
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></symbol>
    <symbol id="i-vol-up" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M19 9v6M16 12h6"/></symbol>
    <symbol id="i-vol-down" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 12h6"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l6 6M22 9l-6 6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-source" viewBox="0 0 24 24"><path d="M3 15V5h18v10"/><path d="M12 21v-8M8 17l4-4 4 4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M4 5l8 7-8 7z"/><path d="M16 5v14M20 5v14"/></symbol>
    <symbol id="i-rew" viewBox="0 0 24 24"><path d="M11 6l-7 6 7 6zM20 6l-7 6 7 6z"/></symbol>
    <symbol id="i-ffw" viewBox="0 0 24 24"><path d="M13 6l7 6-7 6zM4 6l7 6-7 6z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="1"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-door" viewBox="0 0 24 24"><path d="M6 21V4h12v17M3 21h18"/><path d="M15 12.5v1"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/></symbol>
    <symbol id="i-fan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 10V4M13.7 13l5.2 3M10.3 13l-5.2 3"/></symbol>
    <symbol id="i-scene" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></symbol>
    <symbol id="i-run" viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="1.5"/><path d="M16 11l5-3v8l-5-3z"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a16 16 0 0 1-3.2 3.8M6.6 7.6C4.3 9.2 3 12 3 12s4 6 9 6a8.6 8.6 0 0 0 4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-motion" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
    <symbol id="i-thermo" viewBox="0 0 24 24"><path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/><path d="M12 9v7"/></symbol>
  </svg>

  <div class="frame" id="app">
    <header class="hud">
      <button class="hud-back focusable" id="hudBack" type="button" aria-label="Back" hidden>
        <svg class="ico" aria-hidden="true"><use href="#i-left"/></svg>
      </button>
      <div class="hud-heading">
        <h1 class="hud-title" id="hudTitle">Home</h1>
        <span class="hud-sub" id="hudSub"></span>
      </div>
      <div class="hud-status">
        <span class="status-dot" id="hudDot" aria-hidden="true"></span>
        <span id="hudStatus">Linking</span>
        <time class="hud-clock" id="hudClock">--:--</time>
      </div>
    </header>

    <main class="stage">
      <section class="view" id="view-home" data-title="Home" aria-label="Rooms">
        <div class="grid" id="homeGrid"></div>
      </section>

      <section class="view" id="view-room" data-title="Room" aria-label="Room devices" hidden>
        <div class="grid" id="roomGrid"></div>
      </section>

      <section class="view" id="view-detail" data-title="Adjust" aria-label="Adjust device" hidden>
        <div class="detail" id="detail">
          <div class="detail-readout" id="detailReadout">
            <span id="detailValue">--</span><span class="detail-unit" id="detailUnit"></span>
          </div>
          <p class="detail-caption" id="detailCaption"></p>
          <div class="adjust focusable" id="adjust" role="slider" tabindex="0" aria-label="Adjust value" data-autofocus>
            <svg class="ico" aria-hidden="true"><use href="#i-left"/></svg>
            <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
            <svg class="ico rot-90" aria-hidden="true"><use href="#i-chev"/></svg>
          </div>
          <button type="button" class="key focusable detail-power" id="detailPower">
            <svg class="ico" aria-hidden="true"><use href="#i-power"/></svg><span class="key-label" id="detailPowerLabel">Turn off</span>
          </button>
        </div>
      </section>

      <section class="view" id="view-camera" data-title="Camera" aria-label="Camera" hidden>
        <div class="cam">
          <button type="button" class="cam-view focusable" id="camView" data-autofocus aria-label="Camera picture. Select to move the camera">
            <img id="camImg" alt="">
            <span class="cam-status" id="camStatus"><i aria-hidden="true"></i><span id="camStatusText">Connecting</span></span>
            <span class="cam-msg" id="camMsg"></span>
            <span class="cam-move" aria-hidden="true">
              <svg class="ico cm-up"><use href="#i-chev"/></svg>
              <svg class="ico cm-down rot-180"><use href="#i-chev"/></svg>
              <svg class="ico cm-left rot-270"><use href="#i-chev"/></svg>
              <svg class="ico cm-right rot-90"><use href="#i-chev"/></svg>
              <span class="cm-label">Swipe to move · Pinch to finish</span>
            </span>
            <span class="cam-hint" id="camHint">Pinch to move camera</span>
          </button>
          <div class="cam-controls" id="camControls"></div>
        </div>
      </section>

      <section class="view" id="view-tv" data-title="TV Remote" aria-label="TV remote" hidden>
        <div class="remote">
          <button type="button" class="key focusable key-power" data-tv="power" aria-label="Power">
            <svg class="ico" aria-hidden="true"><use href="#i-power"/></svg><span class="key-label">Power</span>
          </button>
          <button type="button" class="key focusable key-dpad" data-tv="up" data-repeat aria-label="Up">
            <svg class="ico" aria-hidden="true"><use href="#i-chev"/></svg>
          </button>
          <button type="button" class="key focusable" data-tv="vol_up" data-repeat aria-label="Volume up">
            <svg class="ico" aria-hidden="true"><use href="#i-vol-up"/></svg><span class="key-label">Vol +</span>
          </button>

          <button type="button" class="key focusable" data-tv="back" aria-label="Back">
            <svg class="ico" aria-hidden="true"><use href="#i-back"/></svg><span class="key-label">Back</span>
          </button>
          <button type="button" class="key focusable key-dpad" data-tv="left" data-repeat aria-label="Left">
            <svg class="ico rot-270" aria-hidden="true"><use href="#i-chev"/></svg>
          </button>
          <button type="button" class="key focusable key-ok" data-tv="ok" data-autofocus aria-label="OK">OK</button>
          <button type="button" class="key focusable key-dpad" data-tv="right" data-repeat aria-label="Right">
            <svg class="ico rot-90" aria-hidden="true"><use href="#i-chev"/></svg>
          </button>
          <button type="button" class="key focusable" data-tv="mute" aria-label="Mute">
            <svg class="ico" aria-hidden="true"><use href="#i-mute"/></svg><span class="key-label">Mute</span>
          </button>

          <button type="button" class="key focusable" data-tv="home" aria-label="TV home">
            <svg class="ico" aria-hidden="true"><use href="#i-home"/></svg><span class="key-label">Home</span>
          </button>
          <button type="button" class="key focusable key-dpad" data-tv="down" data-repeat aria-label="Down">
            <svg class="ico rot-180" aria-hidden="true"><use href="#i-chev"/></svg>
          </button>
          <button type="button" class="key focusable" data-tv="vol_down" data-repeat aria-label="Volume down">
            <svg class="ico" aria-hidden="true"><use href="#i-vol-down"/></svg><span class="key-label">Vol −</span>
          </button>

          <button type="button" class="key focusable" data-tv="source" aria-label="Source">
            <svg class="ico" aria-hidden="true"><use href="#i-source"/></svg><span class="key-label">Source</span>
          </button>
          <button type="button" class="key focusable" data-tv="rew" data-repeat aria-label="Rewind">
            <svg class="ico" aria-hidden="true"><use href="#i-rew"/></svg>
          </button>
          <button type="button" class="key focusable" data-tv="play" aria-label="Play or pause">
            <svg class="ico" aria-hidden="true"><use href="#i-play"/></svg>
          </button>
          <button type="button" class="key focusable" data-tv="ffw" data-repeat aria-label="Fast forward">
            <svg class="ico" aria-hidden="true"><use href="#i-ffw"/></svg>
          </button>
          <button type="button" class="key focusable" data-tv="menu" aria-label="Menu">
            <svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg><span class="key-label">Menu</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="hints" id="hints" aria-hidden="true">
      <span><b>Swipe</b> Move</span>
      <span><b>Pinch</b> Select</span>
      <span><b>Hold</b> Repeat</span>
      <span><b>Back</b> Return</span>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="/deck/deck.js"></script>
  <script src="/home/app.js"></script>
</body>
</html>
